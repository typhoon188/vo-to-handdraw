name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: skills/vo-to-handdraw/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2
      - name: Install Python dependencies
        run: pip install -r skills/vo-to-handdraw/requirements.txt
      - name: Production validation
        working-directory: skills/vo-to-handdraw
        run: python tests/test_production.py
      - name: Product-approved hand overlay
        working-directory: skills/vo-to-handdraw
        run: python tests/test_hand_override.py
      - name: Cross-domain smoke and deterministic tests
        working-directory: skills/vo-to-handdraw
        run: python tests/test_layer1.py
